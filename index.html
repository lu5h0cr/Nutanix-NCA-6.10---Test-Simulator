<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador Nutanix NCA 6.10 | Quantyra</title>
  <script src="data/questions.js"></script>
  <style>
    :root{--bg:#070b12;--panel:#101827;--panel2:#0b1220;--text:#e5eefc;--muted:#93a4bd;--cyan:#28d7ff;--blue:#3b82f6;--ok:#2dd4bf;--bad:#fb7185;--warn:#fbbf24;--line:#1f2a3d;}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#132039 0,#070b12 42%,#03050a 100%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;}
    header{padding:28px 18px;text-align:center;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(40,215,255,.08),rgba(0,0,0,0));}
    .brand{letter-spacing:.22em;color:var(--cyan);font-weight:800;font-size:14px}.tag{color:var(--muted);margin-top:6px;font-size:13px}.wrap{max-width:1040px;margin:0 auto;padding:22px}.card{background:rgba(16,24,39,.88);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:16px}label{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}select,button{width:100%;border:1px solid var(--line);border-radius:12px;background:#0b1220;color:var(--text);padding:13px;font-size:15px}button{cursor:pointer;background:linear-gradient(135deg,#0ea5e9,#2563eb);border:0;font-weight:800;letter-spacing:.02em}button.secondary{background:#111827;border:1px solid var(--line)}button.ghost{background:transparent;border:1px solid #29405f}.hidden{display:none!important}.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);padding:8px 12px;border-radius:999px;color:var(--muted);font-size:13px;background:#0b1220}.topbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:14px}.question{font-size:22px;line-height:1.35;margin:12px 0 18px}.options{display:grid;gap:10px}.option{display:flex;gap:12px;align-items:flex-start;background:#0b1220;border:1px solid var(--line);padding:14px;border-radius:14px;cursor:pointer}.option input{margin-top:3px}.option.selected{border-color:var(--blue);background:#0d1b33}.option.correct{border-color:var(--ok);background:rgba(45,212,191,.10)}.option.wrong{border-color:var(--bad);background:rgba(251,113,133,.10)}.actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}.actions button{flex:1;min-width:180px}.answerBox{margin-top:16px;padding:15px;border:1px solid rgba(45,212,191,.35);background:rgba(45,212,191,.08);border-radius:14px;color:#d9fffb}.progress{height:9px;background:#0b1220;border-radius:999px;overflow:hidden;border:1px solid var(--line);margin:12px 0}.bar{height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));width:0}.result{font-size:20px;line-height:1.5}.reviewItem{border-top:1px solid var(--line);padding:14px 0}.small{font-size:13px;color:var(--muted)}
  </style>
</head>
<body>
<header><div class="brand">QUANTYRA</div><h1>Simulador Nutanix NCA 6.10</h1><div class="tag">DATA. INSIGHT. PRECISION. GROWTH.</div></header>
<main class="wrap">
<section id="setup" class="card">
  <h2>Configuración del simulador</h2>
  <p class="small">Modo nocturno, preguntas y respuestas aleatorias por defecto. Incluye modo práctica y modo examen real.</p>
  <div class="grid">
    <div><label>Modo</label><select id="mode"><option value="practice">Prueba de examen práctico</option><option value="exam">Examen real</option></select></div>
    <div><label>Cantidad de preguntas</label><select id="count"><option value="25">25</option><option value="50">50</option><option value="100">100</option><option value="all">Todas</option></select></div>
    <div><label>Aleatorización</label><select id="shuffle"><option value="yes">Preguntas y respuestas aleatorias</option><option value="no">Orden original</option></select></div>
  </div>
  <div class="actions"><button onclick="startExam()">Iniciar simulador</button></div>
</section>
<section id="quiz" class="card hidden">
  <div class="topbar"><span class="pill" id="modeLabel"></span><span class="pill" id="counter"></span><span class="pill" id="scoreLive"></span></div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="small" id="source"></div>
  <div class="question" id="question"></div>
  <div class="options" id="options"></div>
  <div id="answerBox" class="answerBox hidden"></div>
  <div class="actions"><button class="secondary" onclick="backToSetup()">Salir</button><button id="nextBtn" onclick="nextQuestion()">Siguiente pregunta</button></div>
</section>
<section id="results" class="card hidden"></section>
</main>
<script>
let pool=[], current=0, answers=[], practice=false, revealed=false;
function shuffleArray(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function startExam(){
  practice=document.getElementById('mode').value==='practice';
  const qty=document.getElementById('count').value; const random=document.getElementById('shuffle').value==='yes';
  pool=[...window.NCA_QUESTIONS].filter(q=>q.question && q.options && q.options.length>=2);
  if(random) shuffleArray(pool); if(qty!=='all') pool=pool.slice(0,Number(qty));
  pool=pool.map(q=>{let copy=JSON.parse(JSON.stringify(q)); if(random){const pairs=copy.options.map(o=>({o})); shuffleArray(pairs); copy.options=pairs.map(p=>p.o);} return copy;});
  current=0; answers=[]; revealed=false; document.getElementById('setup').classList.add('hidden'); document.getElementById('results').classList.add('hidden'); document.getElementById('quiz').classList.remove('hidden'); renderQuestion();
}
function selectedValues(){return [...document.querySelectorAll('input[name=opt]:checked')].map(i=>i.value)}
function isCorrect(q, selected){const ca=(q.correctAnswers||[]).map(norm).filter(Boolean); const sa=selected.map(norm); return ca.length===sa.length && ca.every(x=>sa.includes(x));}
function renderQuestion(){
  revealed=false; const q=pool[current]; document.getElementById('answerBox').classList.add('hidden'); document.getElementById('answerBox').innerHTML='';
  document.getElementById('modeLabel').textContent=practice?'Modo práctica':'Modo examen real'; document.getElementById('counter').textContent=`Pregunta ${current+1} de ${pool.length}`; document.getElementById('scoreLive').textContent=`Respondidas: ${answers.length}`; document.getElementById('bar').style.width=`${((current)/pool.length)*100}%`; document.getElementById('source').textContent=`Fuente: ${q.source || 'PDF'} | ID: ${q.id}`; document.getElementById('question').textContent=q.question;
  const type=q.multiple?'checkbox':'radio'; document.getElementById('options').innerHTML=q.options.map((o,i)=>`<label class="option"><input type="${type}" name="opt" value="${escapeHtml(o)}"> <span>${escapeHtml(o)}</span></label>`).join('');
  document.querySelectorAll('.option').forEach(el=>el.addEventListener('click',()=>{setTimeout(()=>{document.querySelectorAll('.option').forEach(x=>x.classList.toggle('selected',x.querySelector('input').checked));},0)}));
  document.getElementById('nextBtn').textContent=practice?'Ver respuesta / Siguiente':'Siguiente pregunta';
}
function nextQuestion(){
  const q=pool[current]; const selected=selectedValues();
  if(!selected.length){alert('Selecciona una respuesta antes de continuar.'); return;}
  if(practice && !revealed){
    revealed=true; const correct=(q.correctAnswers||[]).map(norm); document.querySelectorAll('.option').forEach(el=>{const v=norm(el.querySelector('input').value); if(correct.includes(v)) el.classList.add('correct'); else if(el.querySelector('input').checked) el.classList.add('wrong');});
    document.getElementById('answerBox').classList.remove('hidden'); document.getElementById('answerBox').innerHTML='<b>Respuesta correcta:</b><br>'+escapeHtml((q.correctAnswers||[]).join(' / ')); document.getElementById('nextBtn').textContent=current===pool.length-1?'Finalizar':'Siguiente pregunta'; return;
  }
  answers[current]={id:q.id, question:q.question, selected, correctAnswers:q.correctAnswers||[], ok:isCorrect(q,selected)};
  if(current<pool.length-1){current++; renderQuestion();} else showResults();
}
function showResults(){document.getElementById('quiz').classList.add('hidden'); const ok=answers.filter(a=>a.ok).length; const pct=Math.round((ok/pool.length)*100); const missed=answers.filter(a=>!a.ok).slice(0,80); document.getElementById('results').classList.remove('hidden'); document.getElementById('results').innerHTML=`<h2>Resultado final</h2><div class="result"><b>${ok}/${pool.length}</b> correctas (${pct}%).</div><div class="actions"><button onclick="backToSetup()">Nuevo intento</button></div><h3>Revisión de errores</h3>${missed.map(a=>`<div class="reviewItem"><b>${escapeHtml(a.question)}</b><br><span class="small">Tu respuesta: ${escapeHtml(a.selected.join(' / ')||'-')}</span><br><span class="small">Correcta: ${escapeHtml(a.correctAnswers.join(' / ')||'-')}</span></div>`).join('')}`;}
function backToSetup(){document.getElementById('quiz').classList.add('hidden'); document.getElementById('results').classList.add('hidden'); document.getElementById('setup').classList.remove('hidden');}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
</script>
</body></html>
